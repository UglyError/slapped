name: Slapped
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  Slapped:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - Slapped
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Slapped/Info.plist
      properties:
        CFBundleDisplayName: Slapped
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Slapped uses the camera to scan stickers you find.
        NSPhotoLibraryUsageDescription: Choose a photo of a sticker to log.
        NSLocationWhenInUseUsageDescription: Slapped tags each sticker with where you found it and shows stickers near you.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.slapped
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
